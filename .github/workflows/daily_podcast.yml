name: PodCastTI Daily Automation

on:
  schedule:
    # Executa automaticamente todos os dias às 07:00 AM (UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts feedparser google-genai

      - name: Executar Pipeline Automático
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_pipeline.py

      - name: Fazer Commit e Push do Novo Episódio
        run: |
          git config --global user.name 'PodCastTI Bot'
          git config --global user.email 'bot@podcastti.local'
          git add episodes.json rss.xml episodes/
          git commit -m "auto: Publicado novo episódio do PodCastTI [skip ci]" || exit 0
          git push
