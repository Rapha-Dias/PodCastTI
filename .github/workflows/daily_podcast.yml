name: PodCastTI Daily Automation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline Automático
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_PODCASTTI: ${{ secrets['Gemini API Key -PodCastTI'] || secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Fazer Commit e Push do Novo Episódio
        run: |
          git config --global user.name 'PodCastTI Bot'
          git config --global user.email 'bot@podcastti.local'
          git add data/episodes.json rss.xml episodes/
          git commit -m "auto: Publicado novo episódio do PodCastTI [skip ci]" || exit 0
          git push origin HEAD:main
